<!DOCTYPE html>
<head>
    <title> HOTEL ROOM BOOKING
    </title>
</head>

    <h1 align="center"> Hotel Room Booking Form</h1>
    <p align="center"></p>
    <p align="center"><label for="full-name" >FULL Name:</label>
    <input type="text" id="full-name" name="full-name" required></p> 
    <p align="center"><label for="email" >Email:</label>
    <input type="email" id="email" name="email" required></p> 
    <p align="center"><label for="phone" >Phone:</label>
    <input type="tel" id="phone" name="phone" required></p> 
    <p align="center"><label for="check-in" >Check-in Date:</label>
    <input type="date" id="check-in" name="check-in" required></p> 
    <p align="center"><label for="check-out" >Check-out Date:</label>
    <input type="date" id="check-out" name="check-out" required></p>
    <p align="center"><label for="room-type" >Room Type:</label>
    <select id="room-type" name="room-type" required>
        <option value="">Select Room Type</option>
        <option value="single">Single</option>
        <option value="double">Double</option>
        <option value="suite">Suite</option>
    </select> <br>
    <label for="special-requests" > Number of Guests:</label>
    <input type="number" id="special-requests" name="special-requests" min="1" required> <br>
    <label for="special-requests" > Special Requests:</label><br>
    <textarea id="special-requests" name="special-requests"></textarea> <br>
    <input type="submit" value="Book Now">  <input type="reset" value="Reset form "></p>
